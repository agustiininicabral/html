name: Validate and deploy portfolio

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "cv.html"
      - "cv-en.html"
      - "wrangler.jsonc"
      - "README.md"
      - "scripts/**"
      - "dist/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare static assets
        run: |
          mkdir -p dist
          cp index.html style.css script.js cv.html cv-en.html dist/

      - name: Validate site structure and content
        run: python3 scripts/validate_site.py

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Check Cloudflare credentials
        id: cloudflare
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validation passed. Cloudflare deployment was skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are available."
          fi

      - name: Deploy to Cloudflare Workers
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cloudflare.outputs.available == 'true' }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Confirm validation-only run
        if: ${{ github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cloudflare.outputs.available != 'true') }}
        run: echo "Validation passed. Production deployment was skipped because credentials are unavailable or this is a pull request."
